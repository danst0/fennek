; =============================================================================
; LilyGO T-Deck Pro — Minimaler MP3-Player (Neuaufbau)
;
; Fokus: responsive Touch-UI, stotterfreie MP3-Wiedergabe.
; Hardware: ESP32-S3, 8 MB PSRAM, E-Ink GDEQ031T10 (240x320),
;           CST328-Touch (I2C), PCM5102A-DAC (I2S), SD-Karte (geteilter SPI).
;
; Toolchain-Kombination bewusst identisch zum (archivierten) Legacy-Build,
; weil genau diese Versionen auf der Hardware liefen:
;   - espressif32 6.11.0  (Arduino-ESP32 2.0.17 / IDF 4.4)
;   - ESP32-audioI2S 2.0.6 (passt zur Legacy-I2S-API)
; Der alte MeshCore-Code (Meck-Fork) liegt in der Git-Historie.
; =============================================================================

[platformio]
default_envs = fennek

[env:fennek]
platform = platformio/espressif32@6.11.0
board = t-deck_pro
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB

build_flags =
  -D BOARD_HAS_PSRAM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
  -D CORE_DEBUG_LEVEL=1
  ; PSRAM für Allokationen > Schwelle bevorzugen (Audio-Puffer landen im PSRAM)
  -D CONFIG_SPIRAM_USE_MALLOC=1
  ; E-Ink-Modell für GxEPD2 (3.1" GDEQ031T10, 240x320)
  -D EINK_DISPLAY_MODEL=GxEPD2_310_GDEQ031T10
  ; Aktiviert den vendored Hynitron-Touch-Stack (CST328) für die Pro-Variante.
  -D FENNEK_HYN_TOUCH_PRO=1
  ; Diagnose: -D AUDIO_DEBUG_GAP misst die maximale audio.loop()-Lücke (Stotter-Test)
  ; Debug: -D BATTLOG protokolliert Akkustand + Aktivität (App/Audio/Mesh/WLAN/
  ;   Standby) mit Zeitstempel nach /.fennek/battery.log (services/battlog.*).
  ;   Zum Verstehen des Stromverbrauchs gedacht — zum Ausbau einfach Zeile löschen.
  -D BATTLOG
  ; --- MeshCore (lib/meshcore, vendored) + LoRa SX1262 ---
  ; Compile-Defaults = "EU/UK Narrow" (Standard in Deutschland/NRW): 869,618 MHz,
  ; BW 62,5 kHz, SF 8, CR 4/5 — identisch zu Daniels Repeater-Build
  ; (../meshcore_bridge_repeater/firmware/platformio.ini). Zur Laufzeit
  ; überschreibbar (Settings-App / NVS, mesh_client::applyRadioParams()).
  ; WICHTIG: P_LORA_SCLK absichtlich NICHT definiert — das Radio nutzt die
  ; bereits initialisierte g_spi-Instanz (geteilter Bus, g_spiMutex).
  -D RADIOLIB_STATIC_ONLY=1
  -D RADIOLIB_GODMODE=1
  -D LORA_FREQ=869.618
  -D LORA_BW=62.5
  -D LORA_SF=8
  -D LORA_CR=5
  -D LORA_TX_POWER=22
  -D SX126X_DIO2_AS_RF_SWITCH
  -D SX126X_DIO3_TCXO_VOLTAGE=2.4f
  -D SX126X_CURRENT_LIMIT=140
  -D SX126X_RX_BOOSTED_GAIN=1
  -D MAX_CONTACTS=64
  -D MAX_GROUP_CHANNELS=8
  ; loopTask-Stack von 8 KB auf 16 KB — HTTPClient + WiFiClientSecure
  ; auf dem Stack kosten ~4-6 KB; ohne diese Reserve: Stack-Canary-Overflow
  ; beim Podcast-Download (Guru Meditation, Stack canary watchpoint triggered).
  ; ACHTUNG: CONFIG_ARDUINO_LOOP_STACK_SIZE wird von sdkconfig.h (qio_qspi)
  ; ohne #ifndef-Guard auf 8192 redefiniert → ARDUINO_LOOP_STACK_SIZE direkt
  ; setzen, damit der #ifndef-Block in main.cpp komplett übersprungen wird.
  -D ARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
  zinggjm/GxEPD2 @ ^1.5.9
  adafruit/Adafruit GFX Library @ ^1.11.0
  https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.6
  jgromes/RadioLib @ ^7.3.0
  rweather/Crypto @ ^0.4.0
  densaugeo/base64 @ ^1.4.0
  lewisxhe/SensorLib @ ^0.2.0
